name: Install Cloudflare Analytics Panorama
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-panorama-analytics.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install beacon across HTML pages and verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          token = "43884f0d3e534deba132ad3a6ce02ccc"
          snippet = ('<!-- Cloudflare Web Analytics -->\n'
                     '<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" '
                     'data-cf-beacon=\'{"token":"'+token+'"}\'></script>\n'
                     '<!-- End Cloudflare Web Analytics -->\n')
          html_files = sorted(Path('.').rglob('index.html'))
          assert len(html_files) == 20, f"Expected 20 pages, found {len(html_files)}"
          for file in html_files:
            text = file.read_text(encoding='utf-8')
            count = text.count('static.cloudflareinsights.com/beacon.min.js')
            if count == 0:
              assert re.search('</head>',text,re.I), str(file)
              text = re.sub('</head>', lambda m: snippet+m.group(0), text, count=1, flags=re.I)
              file.write_text(text,encoding='utf-8')
            elif count != 1 or token not in text:
              raise ValueError(f"Conflicting analytics beacon: {file}")
          for file in html_files:
            text = file.read_text(encoding='utf-8')
            assert text.count('static.cloudflareinsights.com/beacon.min.js') == 1, str(file)
            assert token in text, str(file)
          print(f"Verified Cloudflare Analytics on {len(html_files)} HTML pages")
          PY
      - name: Commit site tracking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Install Cloudflare Web Analytics on all Panorama FR and EN pages"
            git push
          fi
