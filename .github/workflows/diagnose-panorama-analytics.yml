name: Diagnose Panorama Analytics Beacon
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-panorama-analytics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Observe browser beacon and response
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1280,height:900}});
            const page=await context.newPage();
            let requested=0,posts=0,failures=[];
            page.on('request',r=>{
              const u=r.url();
              if(u.includes('cloudflareinsights.com')) {
                if(u.includes('beacon.min.js'))requested++;
                if(u.includes('/cdn-cgi/rum'))posts++;
                console.log('ANALYTICS_REQUEST',r.method(),new URL(u).host,new URL(u).pathname);
              }
            });
            page.on('response',r=>{
              if(r.url().includes('cloudflareinsights.com')) console.log('ANALYTICS_RESPONSE',r.status(),new URL(r.url()).pathname);
            });
            page.on('requestfailed',r=>{
              if(r.url().includes('cloudflareinsights.com')) failures.push(r.failure()?.errorText||'failed');
            });
            page.on('console',m=>{
              if(m.type()==='error')console.log('BROWSER_CONSOLE_ERROR',m.text().slice(0,250))
            });
            await page.goto('https://panoramaadvisory.ca/?cf_diagnostic=20261016',{waitUntil:'networkidle',timeout:45000});
            await page.waitForTimeout(4500);
            const facts=await page.evaluate(()=>({
              host:location.hostname,
              scripts:[...document.scripts].filter(x=>x.src.includes('cloudflareinsights')).map(x=>({src:x.src,type:x.type,token:x.getAttribute('data-cf-beacon')})),
              csp:document.querySelector('meta[http-equiv="Content-Security-Policy"]')?.content||null
            }));
            console.log('ANALYTICS_FACTS',JSON.stringify(facts));
            console.log('ANALYTICS_SUMMARY',JSON.stringify({requested,posts,failures}));
            await browser.close();
            if(!requested||!posts||failures.length)process.exit(1);
          })().catch(e=>{console.error('BROWSER_DIAGNOSTIC_ERROR',e.message);process.exit(1)});
          JS
